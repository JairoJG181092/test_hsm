spring.application.name=hsm-file-crypto

# HSM / Realsec
hsm.realsec.provider.name=${HSM_REALSEC_PROVIDER_NAME:RealsecPKCS11Provider}
hsm.realsec.config.path=${HSM_REALSEC_CONFIG_PATH:}
hsm.realsec.config.pathserver=${HSM_REALSEC_CONFIG_SERVER_PATH:}
hsm.realsec.type=${HSM_REALSEC_KEYSTORE_TYPE:RealsecKS}
hsm.realsec.pin=${HSM_REALSEC_PIN:}

# File encryption format
file-crypto.rsa-transformation=${FILE_CRYPTO_RSA_TRANSFORMATION:RSA/ECB/OAEPWithSHA-256AndMGF1Padding}
file-crypto.aes-key-size=${FILE_CRYPTO_AES_KEY_SIZE:256}
file-crypto.gcm-tag-bits=${FILE_CRYPTO_GCM_TAG_BITS:128}
file-crypto.gcm-iv-bytes=${FILE_CRYPTO_GCM_IV_BYTES:12}
file-crypto.buffer-bytes=${FILE_CRYPTO_BUFFER_BYTES:1048576}
file-crypto.parallelism=${FILE_CRYPTO_PARALLELISM:4}
file-crypto.output-extension=${FILE_CRYPTO_OUTPUT_EXTENSION:.hsm}
file-crypto.max-file-size=${FILE_CRYPTO_MAX_FILE_SIZE:0}

# REST
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# Existing JWS/JWE validation settings
jws.alg=${JWS_ALG:RS256}
jws.cty=JWT
jws.iss=${JWS_ISS:arc}
jws.sub=${JWS_SUB:arc}
jwe.alg=${JWE_ALG:RSA-OAEP-256}
jwe.enc=${JWE_ENC:A256GCM}
jwe.cty=JWT
